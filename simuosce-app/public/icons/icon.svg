<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DC9C9"/>
      <stop offset="100%" stop-color="#2AABAB"/>
    </linearGradient>
    <linearGradient id="ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.9)"/>
    </linearGradient>
    <clipPath id="rr">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="white" fill-opacity="0.05"/>

  <!-- ECG waveform -->
  <polyline
    points="46,256 112,256 138,192 155,320 172,152 190,344 210,256 280,256 306,192 323,320 340,156 360,344 380,256 466,256"
    fill="none"
    stroke="url(#ecg)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#rr)"
  />
</svg>
