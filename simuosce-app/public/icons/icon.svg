<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC9C4"/>
      <stop offset="100%" stop-color="#1A8A87"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="40%"  stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <clipPath id="rr">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- subtle inner glow -->
  <rect width="512" height="512" rx="115" fill="white" fill-opacity="0.04"/>
  <!-- ECG waveform -->
  <polyline
    points="44,256 108,256 135,190 153,322 170,148 188,346 210,256 280,256 307,190 325,322 342,152 360,346 382,256 468,256"
    fill="none" stroke="url(#pulse)" stroke-width="22"
    stroke-linecap="round" stroke-linejoin="round" clip-path="url(#rr)"/>
</svg>
