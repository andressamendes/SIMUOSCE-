<!-- Logo baseado no badge circular "Chapa Sérgio Ferreira" -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </radialGradient>
    <!-- Top arc for "CHAPA SÉRGIO FERREIRA" -->
    <path id="topArc" d="M 22,100 A 78,78 0 0,1 178,100"/>
    <!-- Bottom arc for "AFYA · GUANAMBI" -->
    <path id="botArc" d="M 32,120 A 72,72 0 0,0 168,120"/>
  </defs>

  <!-- Drop shadow circle -->
  <circle cx="100" cy="102" r="90" fill="rgba(0,0,0,0.08)"/>

  <!-- Main background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)"/>

  <!-- Outer border ring -->
  <circle cx="100" cy="100" r="89" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-dasharray="2 2"/>

  <!-- Center: Stylized "SF" monogram -->
  <circle cx="100" cy="96" r="34" fill="#1a1a1a" fill-opacity="0.04"/>
  <text x="100" y="107" text-anchor="middle" fill="#1a1a1a" font-size="36"
        font-family="-apple-system, 'Helvetica Neue', sans-serif" font-weight="800"
        letter-spacing="-2">SF</text>

  <!-- Caduceus staff below monogram -->
  <line x1="100" y1="112" x2="100" y2="132" stroke="#1a1a1a" stroke-width="1.5" stroke-opacity="0.35"/>
  <ellipse cx="100" cy="136" rx="6" ry="3" fill="#1a1a1a" fill-opacity="0.25"/>

  <!-- Year: "2 0 2 6" centered on both sides -->
  <text x="68" y="148" text-anchor="middle" fill="#1a1a1a" font-size="9"
        font-family="-apple-system, sans-serif" font-weight="600" letter-spacing="3" opacity="0.6">2026</text>
  <text x="133" y="148" text-anchor="middle" fill="#1a1a1a" font-size="9"
        font-family="-apple-system, sans-serif" font-weight="600" letter-spacing="3" opacity="0.6"> </text>

  <!-- Circular text top: CHAPA SÉRGIO FERREIRA -->
  <text font-size="11" fill="#1a1a1a" font-family="-apple-system, 'Helvetica Neue', sans-serif"
        font-weight="700" letter-spacing="2.8">
    <textPath href="#topArc" startOffset="8%">CHAPA SÉRGIO FERREIRA</textPath>
  </text>

  <!-- Bottom: Afya branding -->
  <text font-size="9.5" fill="#1a1a1a" font-family="-apple-system, sans-serif"
        font-weight="700" letter-spacing="1.5" opacity="0.75">
    <textPath href="#botArc" startOffset="18%">AFYA · GUANAMBI · BA</textPath>
  </text>
</svg>
